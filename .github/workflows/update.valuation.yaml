name: Update Valuation Data

on:
  schedule:
    # 每天美股收盤後運行 (UTC 22:00，大約美東下午 5 點)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允許手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # 確保有權限推回代碼
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 解決 Python 3.9 的類型標註錯誤

    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 如果你有 requirements.txt，可以用 pip install -r requirements.txt
        pip install -r requirements.txt

    - name: Read private Stock Watcher coverage registry
      shell: pwsh
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        $ErrorActionPreference = 'Stop'
        $registryPath = 'data/watcher_coverage_universe.json'
        $output = & npx wrangler r2 object get 'valuation-watcher-data/coverage/universe.json' --file $registryPath --remote 2>&1
        if ($LASTEXITCODE -ne 0) {
          $message = ($output | Out-String)
          if ($message -match '(?i)NoSuchKey|not found|404') {
            @{ schemaVersion = '1.0'; symbols = @() } | ConvertTo-Json -Compress | Set-Content -NoNewline $registryPath
          } else {
            throw "Coverage registry download failed: $message"
          }
        }

    - name: Run Pipeline Script
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        FMP_API_KEY_2: ${{ secrets.FMP_API_KEY_2 }}
        FMP_API_KEY_3: ${{ secrets.FMP_API_KEY_3 }}
      run: python generate_valuation.py --universe-file data/watcher_coverage_universe.json --write-resolved-symbols data/watcher_coverage_symbols.json

    - name: Build quarterly earnings reports
      run: python generate_earning_report.py

    - name: Build validated Stock Watcher exports
      run: python export_watcher_data.py --expected-symbols-file data/watcher_coverage_symbols.json

    - name: Publish Stock Watcher exports to private R2
      shell: pwsh
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseId = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID"
        if ([string]::IsNullOrWhiteSpace($releaseId) -or $releaseId -eq '-') { throw 'GitHub release identity is unavailable.' }
        Get-ChildItem data/watcher_exports -Recurse -File | ForEach-Object {
          $key = $_.FullName.Substring((Resolve-Path data/watcher_exports).Path.Length + 1).Replace('\', '/')
          npx wrangler r2 object put "valuation-watcher-data/releases/$releaseId/$key" --file $_.FullName --remote
          if ($LASTEXITCODE -ne 0) { throw "R2 release upload failed: $key" }
        }
        $pointerPath = Join-Path $env:RUNNER_TEMP 'valuation-watcher-current.json'
        @{ schemaVersion = '1.0'; releaseId = $releaseId; generatedAt = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json -Compress | Set-Content -NoNewline $pointerPath
        npx wrangler r2 object put valuation-watcher-data/current.json --file $pointerPath --remote
        if ($LASTEXITCODE -ne 0) { throw 'R2 release pointer update failed.' }

    - name: Commit and Push changes
      run: |
        # 設置 Git 使用者資訊
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 確保添加所有包含子資料夾的 JSON 數據
        # 這樣增量更新後的 fmp_cache 才會被存入你的 Git 倉庫
        git add data/fmp_cache/ data/results/
        
        # 檢查是否有實際變動，防止 commit 失敗導致 Workflow 報錯
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes detected, skipping commit."
        else
          git commit -m "🤖 Auto-update valuation data [$(date +'%Y-%m-%d')]"
          git push origin master
        fi
